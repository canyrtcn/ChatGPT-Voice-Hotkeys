<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT Voice Hotkeys</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img class="logo" src="icons/icon-48.png" alt="" width="39" height="39">
      <div>
        <h1>Voice Hotkeys</h1>
        <p>Keyboard shortcuts for ChatGPT dictation</p>
      </div>
      <span class="version">v0.1.0</span>
    </header>
    <section aria-label="Keyboard shortcuts">
      <div class="shortcut-row">
        <div class="meta"><strong>Start / stop recording</strong><small>Toggle recording with one shortcut</small></div>
        <button type="button" class="hotkey" id="toggle" aria-label="Change start/stop shortcut">Alt + Z</button>
      </div>
      <div class="shortcut-row">
        <div class="meta"><strong>Send message</strong><small>Presses the blue send button</small></div>
        <button type="button" class="hotkey" id="send" aria-label="Change send shortcut">Alt + X</button>
      </div>
    </section>
    <p id="message" class="status" role="status" aria-live="polite">Click a shortcut to change it.</p>
    <div class="footer">
      <button type="button" id="reset" class="reset">Reset shortcuts</button>
      <div class="footer-right">
        <span class="focus-hint">When the ChatGPT tab is focused</span>
        <a class="github-link" href="https://github.com/canyrtcn" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile of the extension author">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 19 4.77 5.07 5.07 0 0 0 18.91 1S17.73.65 15 2.48a13.38 13.38 0 0 0-7 0C5.27.65 4.09 1 4.09 1a5.07 5.07 0 0 0-.09 3.77 5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 8 18.13V22"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </main>
  <script src="shortcuts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
